services:
  postgres:
    image: postgres:16
    container_name: opsiq-postgres-compose
    environment:
      POSTGRES_DB: opsiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - opsiq-postgres-data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: opsiq-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opsiq
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./opsiq-frontend
    container_name: opsiq-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  opsiq-postgres-data: